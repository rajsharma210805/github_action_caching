name: Frontend Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'src/App.jsx'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      #3. Cache npm dependencies
      - name: Cache npm dependencies
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      #4. Install dependencies on cache miss
      - name: Cache Miss - Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: |
          echo "CACHE MISS: Installing dependencies..."
          npm ci

      #5. Skip installation on cache hit
      - name: Cache Hit - Skip installation
        if: steps.npm-cache.outputs.cache-hit == 'true'
        run: |
          echo "CACHE HIT: npm cache restored!"
          npm ci --prefer-offline

      #6. Docker Hub login
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #7. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend:latest

      #8. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST1 }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY1 }}
          port: 22
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/frontend:latest
            sudo docker stop frontend || true
            sudo docker rm frontend || true
            sudo docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 3000:80 \
              ${{ secrets.DOCKER_USERNAME }}/frontend:latest
